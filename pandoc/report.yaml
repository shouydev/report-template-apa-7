from: markdown
standalone: true
toc: false
toc-depth: 4
number-sections: false
citeproc: true
template: pandoc/template/eisvogel.tex
pdf-engine: lualatex

resource-path:
  - .
  - report
  - report/assets

metadata:
  lang: es-ES
  figureTitle: "Figura"
  tableTitle: "Tabla"
  figPrefix: "Figura"
  tblPrefix: "Tabla"

variables:
  graphics: true
  multirow: true
  disable-header-and-footer: true
  geometry:
    - margin=1in
  linestretch: 1.5
  indent: true

  header-includes:
    - |
      % Viudas y huérfanas
      \clubpenalty=10000
      \widowpenalty=10000
      \displaywidowpenalty=10000
    - |
      % Sangría de 0.5 pulgadas
      \setlength{\parindent}{0.5in}
    - |
      % Alineación a la izquierda
      \AtBeginDocument{\raggedright}
    - |
      % Numeración arriba a la derecha (APA 7)
      \usepackage{fancyhdr}
      \pagestyle{fancy}
      \fancyhf{}
      \renewcommand{\headrulewidth}{0pt}
      \fancyhead[R]{\thepage}
      \fancypagestyle{plain}{
        \fancyhf{}
        \renewcommand{\headrulewidth}{0pt}
        \fancyhead[R]{\thepage}
      }
    - |
      % Quitar título automático de índice
      \makeatletter
      \renewcommand{\tableofcontents}{\@starttoc{toc}}
      \makeatother
    - |
      \usepackage{tabularx}
      \usepackage{multirow}
      \usepackage{array}
    - |
      % Configuración de APA 7 para Tablas y Figuras
      \usepackage{caption}
      \captionsetup{
        labelsep=newline,
        justification=raggedright,
        singlelinecheck=false,
        textfont={it, color=black},
        labelfont={bf, color=black},
        skip=10pt
      }
      \captionsetup[table]{position=top}
      \captionsetup[figure]{position=top}
      
      % Forzar el título de las figuras en la parte superior
      \floatstyle{plaintop}
      \restylefloat{figure}
      
      % Renombrar 'Cuadro' a 'Tabla'
      \AtBeginDocument{
        \renewcommand{\tablename}{Tabla}
        \renewcommand{\listtablename}{Índice de tablas}
      }

filters:
  - pandoc-crossref

bibliography:
  - report/bibliography/references.bib

csl: pandoc/csl/apa-7.csl