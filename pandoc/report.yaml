from: markdown
standalone: true
toc: false
toc-depth: 4
number-sections: false
template: pandoc/template/eisvogel.tex
pdf-engine: lualatex

resource-path:
  - .
  - report
  - report/assets

metadata-files:
  - pandoc/lang/es-ES.yaml

variables:
  graphics: true
  multirow: true
  disable-header-and-footer: true
  block-headings: true
  tables: true
  geometry:
    - margin=1in
  linestretch: 1.5
  indent: true

  header-includes:
    - |
      % Widows and orphans
      \clubpenalty=10000
      \widowpenalty=10000
      \displaywidowpenalty=10000
    - |
      % 0.5-inch first-line indent
      \setlength{\parindent}{0.5in}
    - |
      % Left alignment
      \AtBeginDocument{\raggedright}
    - |
      % Page numbers top right (APA 7)
      \usepackage{fancyhdr}
      \pagestyle{fancy}
      \fancyhf{}
      \renewcommand{\headrulewidth}{0pt}
      \fancyhead[R]{\thepage}
      \fancypagestyle{plain}{
        \fancyhf{}
        \renewcommand{\headrulewidth}{0pt}
        \fancyhead[R]{\thepage}
      }
    - |
      % Remove the automatic table of contents title
      \makeatletter
      \renewcommand{\tableofcontents}{\@starttoc{toc}}
      \makeatother
    - |
      % Force level-4 (\paragraph) and level-5 (\subparagraph) headings onto their own line
      \makeatletter
      \renewcommand\paragraph{\@startsection{paragraph}{4}{\z@}%
        {-2.5ex\@plus -1ex \@minus -.25ex}%
        {1.25ex \@plus .2ex}%
        {\normalfont\normalsize\bfseries}}
      \renewcommand\subparagraph{\@startsection{subparagraph}{5}{\z@}%
        {-2.0ex\@plus -1ex \@minus -.25ex}%
        {1.0ex \@plus .2ex}%
        {\normalfont\normalsize\bfseries}}
      \makeatother
    - |
      \usepackage{booktabs}
      \usepackage{tabularx}
      \usepackage{multirow}
      \usepackage{array}
      % Commands to auto-center header titles in LaTeX tables
      \newcommand{\thfirst}[1]{\multicolumn{1}{|c|}{\textbf{#1}}}
      \newcommand{\thcell}[1]{\multicolumn{1}{c|}{\textbf{#1}}}
      \newcommand{\thc}[1]{\multicolumn{1}{c}{\textbf{#1}}}
      % Macros for column-spanning headers (colspan) with automatic centering and bold
      \newcommand{\thspan}[2]{\multicolumn{#1}{c|}{\textbf{#2}}}
      \newcommand{\thspanfirst}[2]{\multicolumn{#1}{|c|}{\textbf{#2}}}
      % Uniform table horizontal rules (booktabs: toprule, midrule, and bottomrule at the same thickness)
      \AtBeginDocument{
        \setlength{\heavyrulewidth}{\lightrulewidth}
      }
    - |
      % APA 7 caption setup for tables and figures
      \usepackage{caption}
      \captionsetup{
        labelsep=newline,
        justification=raggedright,
        singlelinecheck=false,
        textfont={it, color=black},
        labelfont={bf, color=black},
        skip=10pt
      }
      \captionsetup[table]{position=top}
      \captionsetup[figure]{position=top}

      % Force figure captions to the top (APA 7)
      \floatstyle{plaintop}
      \restylefloat{figure}

      % Rename 'Cuadro' to 'Tabla' (Spanish babel defaults to Cuadro)
      \AtBeginDocument{
        \iflanguage{spanish}{%
          \renewcommand{\tablename}{Tabla}%
          \renewcommand{\listtablename}{Índice de tablas}%
        }{}%
      }

filters:
  - pandoc-crossref
  - citeproc
  - pandoc/filters/table-headers-autocenter.lua
  - pandoc/filters/table-row-lines.lua

bibliography:
  - report/bibliography/references.bib

csl: pandoc/csl/apa-7.csl